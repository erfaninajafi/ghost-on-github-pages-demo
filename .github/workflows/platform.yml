name: ExpertsAcademy platform
on:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: blog_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test -d blog_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://test:test@localhost:5432/blog_test?sslmode=disable
      TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache-dependency-path: apps/api/go.sum
      - uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: '1.30.0'
      - name: Check generated queries
        working-directory: apps/api
        run: |
          sqlc generate
          git diff --exit-code -- internal/repository/db
      - name: Apply migrations
        run: docker run --rm --network host -v "$PWD/apps/api/db/migrations:/migrations:ro" migrate/migrate:v4.18.3 -path /migrations -database "$TEST_DATABASE_URL" up
      - name: Unit and database integration tests
        working-directory: apps/api
        run: |
          go vet ./...
          go test -race -cover ./...
      - name: Verify reversible migration on disposable CI database
        run: |
          docker run --rm --network host -v "$PWD/apps/api/db/migrations:/migrations:ro" migrate/migrate:v4.18.3 -path /migrations -database "$TEST_DATABASE_URL" down -all
          docker run --rm --network host -v "$PWD/apps/api/db/migrations:/migrations:ro" migrate/migrate:v4.18.3 -path /migrations -database "$TEST_DATABASE_URL" up
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - working-directory: apps/web
        run: npm ci && npm run typecheck && npm test && npm run build
